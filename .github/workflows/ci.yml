name: CI

on:
  push:
    branches: ['**']
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Lint, typecheck y tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La versión de pnpm se toma de "packageManager" en package.json:
      # declararla aquí también hace fallar la acción por versión duplicada.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Dependencias de sistema (Tauri Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Formato
        run: pnpm format:check

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Tests TS
        run: pnpm -r test

      - name: Tests Rust (backend completo)
        working-directory: apps/desktop/src-tauri
        run: cargo test

      - name: Build frontend
        run: pnpm --filter @nodora/desktop build

      - name: Navegador para pruebas de interfaz
        run: pnpm --filter @nodora/desktop exec playwright install --with-deps chromium

      - name: Pruebas de interfaz (Playwright)
        run: pnpm --filter @nodora/desktop test:ui

      - name: Publicar informe de fallos de interfaz
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/desktop/test-results/
          if-no-files-found: ignore

      - name: Auditoría de dependencias (informativa)
        run: |
          pnpm audit --audit-level high || true
          cargo install cargo-audit --locked || true
          (cd apps/desktop/src-tauri && cargo audit) || true

  windows-installer:
    name: Instalador Windows (NSIS)
    runs-on: windows-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      # La versión de pnpm se toma de "packageManager" en package.json:
      # declararla aquí también hace fallar la acción por versión duplicada.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Tests Rust en Windows
        working-directory: apps/desktop/src-tauri
        run: cargo test

      - name: Construir instalador NSIS
        working-directory: apps/desktop
        run: pnpm tauri build --bundles nsis

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: nodora-windows-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
