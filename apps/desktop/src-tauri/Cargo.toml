[package]
name = "nodora-desktop"
version = "0.1.0"
description = "Nodora — espacio de trabajo privado y local-first"
edition = "2021"
license = "UNLICENSED"
publish = false

[lib]
name = "nodora_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
tracing-appender = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
# LTO "thin" en lugar del completo: con LTO completo y codegen-units=1 el
# enlazado superaba los 45 minutos en los runners de Windows y hacía el
# pipeline inviable. Coste medido del cambio: el binario pasa de 6,5 MB a
# 8,3 MB (compilación local de 5m28s a 3m07s). Se acepta: 8 MB sigue siendo
# muy pequeño para una app de escritorio y el pipeline vuelve a ser usable.
codegen-units = 16
lto = "thin"
opt-level = "s"
strip = true
